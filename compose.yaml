name: mabetek
x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://mabetek:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/mabetek
  networks: [internal]
  restart: unless-stopped
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: mabetek
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: mabetek
    volumes: [postgres_data:/var/lib/postgresql]
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mabetek -d mabetek"]
      interval: 5s
      timeout: 5s
      retries: 15
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    restart: 'no'
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    <<: *backend
    command: [python, -m, app.notifications]
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    build:
      context: ./frontend
      args:
        SITE_URL: ${SITE_URL:-http://localhost}
        SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
    environment:
      API_INTERNAL_URL: http://api:8000
      SITE_URL: ${SITE_URL:-http://localhost}
      SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
    networks: [internal]
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
    restart: unless-stopped
    depends_on: [web, api]
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
networks:
  internal:
