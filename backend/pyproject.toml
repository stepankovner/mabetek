[project]
name = "mabetek-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy[asyncio]>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "sqladmin>=0.21,<1", "itsdangerous>=2.2,<3", "argon2-cffi>=23,<26", "python-multipart>=0.0.20", "email-validator>=2.2,<3"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pytest-cov>=6,<8"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
